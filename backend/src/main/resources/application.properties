# Server Config
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=always

# Production Neon PostgreSQL Database Configuration (Dynamic Environment Overrides)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brocrewz_db}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate PostgreSQL Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true

# JWT Config
brocrewz.app.jwtSecret=${JWT_SECRET:BroCrewzStudioSecretKeyForJwtAuthenticationPleaseUseLongerKeyInProduction1234567890}
brocrewz.app.jwtExpirationMs=86400000

# SQL Init Mode
spring.sql.init.mode=never

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:placeholder@gmail.com}
spring.mail.password=${MAIL_PASSWORD:placeholder-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
